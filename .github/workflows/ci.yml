name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOPROXY: https://proxy.golang.org,direct
  GOFLAGS: -mod=readonly

jobs:
  test:
    name: test (Go ${{ matrix.go }} / ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        go: ['1.22', '1.23']
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -cover ./...

  # Lint is opt-in for now. Run locally with:
  #   golangci-lint run
  # Re-enable in CI by un-commenting the block below once the style
  # baseline is comfortable.
  #
  # lint:
  #   name: lint
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v5
  #     - uses: actions/setup-go@v6
  #       with:
  #         go-version: '1.23'
  #         cache: true
  #     - uses: golangci/golangci-lint-action@v7
  #       with:
  #         version: latest
  #         args: --timeout=3m

  # The Rust port under rust/ must stay behaviourally identical to the Go
  # reference implementation. This job builds BOTH and diffs them at every layer
  # (lexer → library parser → loader → parser → evaluator → embedding API → CLI →
  # MCP → playground bundle), then runs the Rust engine against the same
  # checked-in goldens the Go suite uses.
  #
  # Additive on purpose: it changes nothing about what ships. The published
  # playground and release binaries still come from the Go tree.
  conformance:
    name: rust/go conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: rust build + clippy (deny warnings)
        working-directory: rust
        run: |
          cargo build --workspace
          cargo clippy --workspace -- -D warnings
      - name: rust tests (incl. the golden suite)
        working-directory: rust
        run: cargo test --workspace
      - name: cross-implementation conformance
        run: ./rust/devtools/conformance.sh
      - name: wasm conformance
        # The browser-facing wasm surface: same JS harness, both engines.
        run: |
          rustup target add wasm32-unknown-unknown
          curl -fsSL https://deno.land/install.sh | DENO_INSTALL="$HOME/.deno" sh -s -- -y >/dev/null
          export PATH="$HOME/.deno/bin:$PATH"
          ./rust/devtools/wasm_compare.sh

  build:
    name: build (${{ matrix.os }})
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          cache: true
      - name: build
        run: go build -o capy ./cmd/capy
      - name: smoke test
        run: ./capy run samples/transpile-py/lib.capy samples/transpile-py/script.capy
        shell: bash
