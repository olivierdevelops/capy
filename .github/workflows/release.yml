name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  # Create the release first so the matrix jobs below have something to upload
  # their archives to, and so the notes are generated once rather than racing.
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          draft: false

  # Cross-compiled release archives. This replaces goreleaser, which only builds
  # Go; the target list, archive naming and bundled extra files are carried over
  # from .goreleaser.yaml unchanged so existing download URLs keep their shape.
  # windows/arm64 is skipped, as it was there.
  upload-assets:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: test before publishing
        working-directory: rust
        run: cargo test --workspace
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: capy,capy-mcp
          target: ${{ matrix.target }}
          manifest-path: rust/Cargo.toml
          # NOTE: this is a NAMING CHANGE from goreleaser, which produced
          # capy_0.20.0_linux_amd64. The action only offers $bin/$target/$tag, so
          # archives are now capy_v0.20.0_x86_64-unknown-linux-gnu. Anything
          # pinning a download URL (an install script, a Homebrew formula) needs
          # updating for the first release after this switch.
          archive: capy_$tag_$target
          tar: unix
          zip: windows
          checksum: sha256
          include: LICENSE,README.md,CHANGELOG.md,docs,samples,schemas
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          # The CLI reads this at compile time for `capy version`; replaces the
          # Go build's -ldflags "-X main.version=...".
          CAPY_VERSION: ${{ github.ref_name }}
