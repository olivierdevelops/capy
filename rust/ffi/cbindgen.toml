# Generates rust/ffi/include/capy.h. Run via rust/ffi/check_header.sh (which also checks for drift).
language = "C"
include_guard = "CAPY_H"
header = "/* capy.h — C ABI for the Capy engine. GENERATED by cbindgen from rust/ffi; do not edit.\n * ABI version 1: within a version, changes are additive only (new functions, never changed signatures).\n * Strings are (ptr, len) UTF-8, NOT NUL-terminated, borrowed from the handle they came from.\n * Ids are valid for one CapyParse. Freeing a handle twice, or using one after its free, is a caller error. */"
sys_includes = ["stdint.h", "stddef.h"]
no_includes = true
cpp_compat = true
usize_is_size_t = true
style = "both"

[export]
include = ["CapyId", "CapyStr", "CapySpan"]

[parse]
parse_deps = false
