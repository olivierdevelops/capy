[package]
name = "capy-mcp"
version = "0.12.0"
edition = "2021"
description = "Model Context Protocol server exposing Capy as a tool to AI agents"
license = "MIT"

[[bin]]
name = "capy-mcp"
path = "src/main.rs"

[dependencies]
capy-core = { path = ".." }
# The MCP transport needs JSON *parsing*; the engine crate only ever writes JSON,
# so serde lives here rather than becoming an engine dependency.
serde = { version = "1", features = ["derive"] }
# `preserve_order` makes `Value` keep insertion order, so the json! literals below
# can reproduce Go's output exactly: Go sorts MAP keys and keeps STRUCT fields in
# declaration order, so maps here are written alphabetically and structs use
# serde derive.
serde_json = { version = "1", features = ["preserve_order"] }
