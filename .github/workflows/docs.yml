name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          # setup-python's pip cache hashes a dependency file; without
          # this it errors with "No file matched to **/requirements.txt
          # or **/pyproject.toml". Our docs reqs live at the repo root.
          cache-dependency-path: requirements-docs.txt

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install MkDocs Material
        run: pip install -r requirements-docs.txt

      - name: Build wasm bundle for playground
        # The playground at docs/assets/playground/ needs capy.wasm +
        # wasm_exec.js + samples.json. Build them fresh from main so the
        # deployed playground tracks the current engine.
        #
        # capy.wasm comes from the capy-wasm-abi crate, and wasm_exec.js is our
        # own loader shim rather than the one that used to be copied out of
        # GOROOT. The shim installs the same globals the page already calls
        # (capyRun / capyDocs / capyIntrospect / capyVersion), so index.html is
        # unchanged and the browser-facing contract is identical.
        run: |
          set -euxo pipefail
          # Stamp the release into the module so the playground toolbar shows it;
          # replaces the Go build's -ldflags "-X main.version=...".
          VERSION=$(git describe --tags --always 2>/dev/null || echo dev)
          CAPY_VERSION="$VERSION" cargo build --release \
            --target wasm32-unknown-unknown \
            --manifest-path rust/Cargo.toml -p capy-wasm-abi
          cp rust/target/wasm32-unknown-unknown/release/capy_wasm_abi.wasm \
            docs/assets/playground/capy.wasm
          cp rust/playground/web/wasm_exec.js docs/assets/playground/wasm_exec.js
          cargo run --release --manifest-path rust/Cargo.toml \
            -p capy-playground-bundle > docs/assets/playground/samples.json
          ls -lh docs/assets/playground/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build site
        run: mkdocs build --strict --verbose

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
