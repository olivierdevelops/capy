[workspace]
members = ["cli", "mcp", "playground", "wasm"]

[package]
name = "capy-core"
version = "0.12.0"
edition = "2021"
rust-version = "1.74"
description = "Capy transpiler engine — a target-agnostic transpiler driven entirely by a .capy library"
license = "MIT"
repository = "https://github.com/olivierdevelops/capy"
keywords = ["transpiler", "dsl", "codegen", "parser"]
categories = ["compilers", "parser-implementations"]
# Ship only the library. The differential-test harnesses under devtools/ and the
# sample corpus stay out of the published crate.
include = ["src/**/*.rs", "Cargo.toml", "README.md", "LICENSE"]

[lib]
name = "capy_core"
path = "src/lib.rs"
# A plain rlib: no cdylib, no `extern "C"` surface. The wasm linear-memory ABI
# lives in the separate `capy-wasm-abi` crate so library consumers inherit
# nothing from it.
crate-type = ["rlib"]

[dependencies]
regex = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The differential-test harnesses. Declared explicitly so `cargo build` doesn't
# pick them up and `include` keeps them unpublished.
[[bin]]
name = "lexdump"
path = "devtools/bin/lexdump.rs"

[[bin]]
name = "helperdump"
path = "devtools/bin/helperdump.rs"

[[bin]]
name = "innerdump"
path = "devtools/bin/innerdump.rs"

[[bin]]
name = "libdump"
path = "devtools/bin/libdump.rs"

[[bin]]
name = "loaddump"
path = "devtools/bin/loaddump.rs"

[[bin]]
name = "parsedump"
path = "devtools/bin/parsedump.rs"

[[bin]]
name = "multidump"
path = "devtools/bin/multidump.rs"

[[bin]]
name = "embeddump"
path = "devtools/bin/embeddump.rs"

[[bin]]
name = "cmddump"
path = "devtools/bin/cmddump.rs"

[[bin]]
name = "pathdump"
path = "devtools/bin/pathdump.rs"

[[bin]]
name = "runcli"
path = "devtools/bin/runcli.rs"

[[bin]]
name = "runcmd"
path = "devtools/bin/runcmd.rs"

[[bin]]
name = "goldenrun"
path = "devtools/bin/goldenrun.rs"

[[bin]]
name = "nativebench"
path = "devtools/bin/nativebench.rs"
